{{template "base" .}}
{{define "title"}}Ascii Web{{end}}
{{define "home"}}
<div id="ascii-form">
    <form method="post" action="/ascii-art">
        <textarea name="text" placeholder="enter the text..."></textarea>

        <select name="banners">
            <option value="standard.txt">standard</option>
            <option value="shadow.txt">shadow</option>
            <option value="thinkertoy.txt">thinkertoy</option>
        </select>

        <button type="submit">Generate</button>
    </form>
</div>
{{end}}
